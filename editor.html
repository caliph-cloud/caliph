<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caliph Editor · Formlee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <div id="editor" class="show">
    <div class="topbar ed-top">
      <button class="back-btn" id="backBtn" title="Back to designs">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <input class="proj-name" id="projName" value="Untitled design">
      <span class="save-status" id="saveStatus">All changes saved</span>
      <div class="ed-spacer"></div>
      <div id="themeSlot"></div>
    </div>
    <div class="ed-body">
      <div class="toolbar">
        <button class="tool-btn" id="addRect" title="Add rectangle">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
        </button>
        <button class="tool-btn" id="addEllipse" title="Add circle">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
        </button>
        <button class="tool-btn" id="addText" title="Add text">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M12 6v14"/></svg>
        </button>
        <button class="tool-btn" id="addImage" title="Add image">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>
        </button>
        <input type="file" id="imgInput" accept="image/*" style="display:none;">
      </div>
      <div class="canvas-wrap">
        <div id="artboard"></div>
      </div>
      <div class="panel" id="panel">
        <div class="panel-empty">Select an element to edit it, or add something from the toolbar.</div>
      </div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script src="editor.js"></script>
</body>
</html>
