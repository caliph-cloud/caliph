<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formlee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <div class="topbar">
    <div class="brand"><span class="dot"></span><b>Formlee</b></div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Search your designs">
    </div>
    <div class="ed-spacer"></div>
    <div id="themeSlot"></div>
  </div>

  <div id="dashboard">
    <div class="sidebar">
      <button class="new-btn ripple-host" id="newDesignBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#EA4335" stroke-width="2.5" stroke-linecap="round"/></svg>
        New design
      </button>
      <div class="nav-item sel" data-filter="all">All designs<span class="nav-count" id="countAll">0</span></div>
      <div class="nav-item" data-filter="starred">Starred<span class="nav-count" id="countStar">0</span></div>
      <div class="nav-item" data-filter="trash">Trash<span class="nav-count" id="countTrash">0</span></div>
    </div>

    <div class="dash-main">
      <div class="dash-head">
        <h1 id="dashTitle">All designs</h1>
        <div class="view-toggle">
          <button id="gridBtn" class="active" title="Grid view">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </button>
          <button id="listBtn" title="List view">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
          </button>
        </div>
      </div>

      <div class="dropzone" id="dropzone">
        Drag an image here to start a new design with it — or <strong>click New design</strong> to start blank.
      </div>

      <div id="listingWrap"></div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script src="shared.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
