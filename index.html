<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayHub — Unblocked Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><rect width=%2224%22 height=%2224%22 rx=%227%22 fill=%22%234285F4%22/><path d=%22M9 7l8 5-8 5V7z%22 fill=%22white%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <button class="icon-btn" id="menuBtn" title="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="brand" data-route="home">
      <span class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24"><rect width="24" height="24" rx="7" fill="#4285F4"/><path d="M9 7l8 5-8 5V7z" fill="white"/></svg></span>
      <span class="brand-name">PlayHub</span>
    </div>
  </div>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="searchInput" placeholder="Search games">
  </div>
  <div class="topbar-actions">
    <div class="theme-indicator" id="themeIndicator" title="Following your system theme">
      <svg id="themeIconSun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg id="themeIconMoon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="hidden"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <button class="nav-item active" data-category="all">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      <span>Home</span>
    </button>
    <div class="sidebar-divider"></div>
    <div class="sidebar-label">Categories</div>
    <button class="nav-item" data-category="arcade">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="3"/><path d="M8 12v4M6 14h4M15 13h.01M18 15h.01"/></svg>
      <span>Arcade</span>
    </button>
    <button class="nav-item" data-category="puzzle">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6v4a2 2 0 1 0 0 4v6h-4a2 2 0 1 1-4 0H3V9a2 2 0 1 0 4 0V3z"/></svg>
      <span>Puzzle</span>
    </button>
    <button class="nav-item" data-category="classics">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M3 9h5M3 15h5"/></svg>
      <span>Classics</span>
    </button>
    <button class="nav-item" data-category="action">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      <span>Action</span>
    </button>
  </nav>

  <main class="main">

    <section id="view-home" class="view">
      <div class="chip-row" id="chipRow"></div>
      <div id="homeGrid" class="game-grid"></div>
      <div id="homeEmpty" class="empty hidden">
        <h2>No games found</h2>
        <p>Try a different search or category.</p>
      </div>
    </section>

    <section id="view-play" class="view hidden">
      <button class="back-btn" id="backBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        All games
      </button>
      <div class="play-layout">
        <div class="play-main">
          <div class="player-frame">
            <div class="player-stage" id="playerStage"></div>
            <div class="player-controls" id="playerControls"></div>
          </div>
          <div class="play-info">
            <h1 id="playTitle"></h1>
            <div class="play-meta">
              <span class="pill" id="playCategory"></span>
              <span id="playPlays"></span>
            </div>
            <p id="playDesc" class="play-desc"></p>
          </div>
        </div>
        <div class="play-side">
          <div class="side-heading">Up next</div>
          <div id="upNextList" class="up-next-list"></div>
        </div>
      </div>
    </section>

  </main>
</div>

<nav class="tabbar">
  <button class="tab-item active" data-category="all">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    <span>Home</span>
  </button>
  <button class="tab-item" data-category="arcade">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="3"/><path d="M8 12v4M6 14h4M15 13h.01M18 15h.01"/></svg>
    <span>Arcade</span>
  </button>
  <button class="tab-item" data-category="puzzle">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6v4a2 2 0 1 0 0 4v6h-4a2 2 0 1 1-4 0H3V9a2 2 0 1 0 4 0V3z"/></svg>
    <span>Puzzle</span>
  </button>
  <button class="tab-item" data-category="action">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
    <span>Action</span>
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
